name: AIOStreams
version: "2026.10.23.34"
slug: aiostreams
description: AIOStreams as a managed Home Assistant app
url: https://github.com/The-IcEDFiRE/icedfire-ha-addons/tree/main/aiostreams
arch:
- amd64
- aarch64
startup: services
boot: auto
init: false
backup: cold
timeout: 60
image: ghcr.io/the-icedfire/ha-aiostreams
ports:
  3000/tcp: 3000
webui: http://[HOST]:[PORT:3000]/stremio/configure
map:
- type: data
  read_only: false
  path: /app/data
options:
  base_url: ''
  secret_key: ''
  environment_overrides_json: '{}'
schema:
  base_url: str
  secret_key: password
  aiostreams_auth: password?
  aiostreams_auth_permissions: str?
  database_uri: str?
  database_pool_size: int?
  redis_uri: str?
  redis_timeout: int?
  settings_refresh_interval: int?
  internal_url: str?
  disk_cache_dir: str?
  log_buffer_max_bytes: int?
  log_buffer_max_entries: int?
  node_env: list(production|development|test)?
  system_lifecycle_enabled: bool?
  log_level: list(fatal|error|warn|info|debug|trace)?
  log_format: list(json|pretty)?
  auth_required: bool?
  allow_private_urls: bool?
  default_timeout: int?
  addon_password: password?
  config_access_key: password?
  session_ttl_seconds: int?
  enable_search_api: bool?
  enable_nab_api: bool?
  addon_name: str?
  addon_id: str?
  custom_html: str?
  tmdb_api_key: password?
  tmdb_access_token: password?
  tvdb_api_key: password?
  trakt_client_id: str?
  log_sensitive_info: bool?
  aio_oidc_enabled: bool?
  aio_oidc_issuer: str?
  aio_oidc_client_id: str?
  aio_oidc_client_secret: password?
  environment_overrides_json: str?
