name: AIOStreams
version: 0.0.0
slug: aiostreams
description: AIOStreams as a managed Home Assistant app
url: https://github.com/The-IcEDFiRE/icedfire-ha-addons/tree/main/aiostreams
arch:
- amd64
- aarch64
startup: services
boot: auto
init: false
backup: cold
timeout: 60
image: ghcr.io/the-icedfire/ha-aiostreams
ports:
  3000/tcp: 3000
webui: http://[HOST]:[PORT:3000]/stremio/configure
map:
- type: data
  read_only: false
  path: /app/data
options:
  base_url: ''
  secret_key: ''
  aiostreams_auth: ''
  aiostreams_auth_permissions: ''
  environment_overrides_json: '{}'
schema:
  base_url: str
  secret_key: password
  aiostreams_auth: password?
  aiostreams_auth_permissions: str?
  environment_overrides_json: str
