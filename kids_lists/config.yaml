name: Kids Lists (Local)
version: "0.1.0"
slug: kids_lists
description: Fully local parent-curated Stremio catalogs with SQLite storage
url: https://github.com/The-IcEDFiRE/icedfire-ha-addons
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
backup: cold
image: ghcr.io/the-icedfire/ha-kids-lists
ports:
  8099/tcp: 8099
webui: http://[HOST]:[PORT:8099]/
map:
  - type: data
    read_only: false
    path: /data
options:
  admin_password: ""
  tmdb_api_key: ""
schema:
  admin_password: password
  tmdb_api_key: password?
