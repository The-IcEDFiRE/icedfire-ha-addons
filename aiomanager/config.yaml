name: AIOManager
version: "2026.10.18.8"
slug: aiomanager
description: AIOManager as a managed Home Assistant app
url: https://github.com/The-IcEDFiRE/icedfire-ha-addons/tree/main/aiomanager
arch:
- amd64
- aarch64
startup: services
boot: auto
init: false
backup: cold
timeout: 60
image: ghcr.io/the-icedfire/ha-aiomanager
ports:
  1610/tcp: 1610
webui: http://[HOST]:[PORT:1610]/
map:
- type: data
  read_only: false
  path: /app/data
options:
  db_type: sqlite
  environment_overrides_json: '{}'
schema:
  encryption_key: password?
  db_type: list(sqlite|postgres)
  database_url: password?
  cors_origins: str?
  node_env: str?
  db_ssl_reject_unauthorized: bool?
  db_pool_size: int?
  db_connection_timeout: int?
  db_max_retries: int?
  read_only_replica: bool?
  ssrf_allow_private: bool?
  trust_proxy: bool?
  registrations_closed: bool?
  unified_enforcement: bool?
  log_level: list(fatal|error|warn|info|debug|trace)?
  log_pretty_print: bool?
  max_sync_payload_size: int?
  proxy_concurrency_limit: int?
  image_proxy_timeout_ms: int?
  image_cache_ttl_ms: int?
  activity_engine_enabled: bool?
  activity_scan_interval_ms: int?
  environment_overrides_json: str?
