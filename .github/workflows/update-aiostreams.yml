name: Publish AIOStreams Home Assistant app

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when upstream image digest is unchanged
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'aiostreams/Dockerfile'
      - 'aiostreams/startup.mjs'
      - 'aiostreams/config.yaml'
      - '.github/workflows/update-aiostreams.yml'

permissions:
  contents: write
  packages: write

concurrency:
  group: aiostreams-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate with GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect upstream image change
        id: upstream
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect ghcr.io/viren070/aiostreams:latest | awk '/^Digest:/ {print $2; exit}')"
          test "$digest" != ''
          test "${digest#sha256:}" != "$digest"
          previous="$(sed -n '/^sha256:/p' aiostreams/upstream-digest.txt | head -n 1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [[ "$digest" != "$previous" || "$EVENT_NAME" != 'schedule' || "$FORCE" == 'true' ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Upstream digest unchanged; nothing to publish.'
          fi
      - name: Choose next app version
        if: steps.upstream.outputs.changed == 'true'
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          # Monotonically increasing for this workflow. Do not reset workflow history.
          version="1.0.${RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and publish amd64 image
        if: steps.upstream.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./aiostreams
          file: ./aiostreams/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: true
          tags: ghcr.io/the-icedfire/amd64-ha-aiostreams:${{ steps.version.outputs.version }}
          build-args: |
            UPSTREAM_IMAGE=ghcr.io/viren070/aiostreams@${{ steps.upstream.outputs.digest }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=amd64
      - name: Build and publish aarch64 image
        if: steps.upstream.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./aiostreams
          file: ./aiostreams/Dockerfile
          platforms: linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ghcr.io/the-icedfire/aarch64-ha-aiostreams:${{ steps.version.outputs.version }}
          build-args: |
            UPSTREAM_IMAGE=ghcr.io/viren070/aiostreams@${{ steps.upstream.outputs.digest }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=aarch64
      - name: Publish combined multi-arch image
        if: steps.upstream.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "ghcr.io/the-icedfire/ha-aiostreams:${VERSION}" \
            "ghcr.io/the-icedfire/amd64-ha-aiostreams:${VERSION}" \
            "ghcr.io/the-icedfire/aarch64-ha-aiostreams:${VERSION}"
          docker buildx imagetools inspect "ghcr.io/the-icedfire/ha-aiostreams:${VERSION}"
      - name: Publish version to HA app repository
        if: steps.upstream.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM_DIGEST: ${{ steps.upstream.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_version.py "$VERSION" "$UPSTREAM_DIGEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aiostreams/config.yaml aiostreams/upstream-digest.txt
          git commit -m "chore: publish AIOStreams app ${VERSION}" || exit 0
          git push origin HEAD:main
