name: Build Kids Lists
on:
  push:
    branches: [main]
    paths:
      - 'kids_lists/**'
      - '.github/workflows/kids-lists-build.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./kids_lists
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/the-icedfire/ha-kids-lists:0.1.0,ghcr.io/the-icedfire/ha-kids-lists:latest
          build-args: |
            BUILD_VERSION=0.1.0
